<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Превью анимаций каста кейсов</title>
<style>
  body{margin:0;background:#0a0a14;font-family:monospace;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .controls{padding:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  button{background:#1a1a2e;border:1px solid #d4af37;color:#d4af37;padding:10px 16px;font-family:monospace;cursor:pointer;border-radius:4px;font-size:13px;}
  button:hover{background:#2a2a3e;}
  #stage{position:relative;width:100%;max-width:420px;height:520px;border:1px solid #333;overflow:hidden;background:#050510;}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  /* ===== ВАРИАНТ 1: Голографическая карта (3D flip + shine) ===== */
  .v1-card{width:140px;height:140px;perspective:800px;}
  .v1-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:v1flip 0.9s cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes v1flip{
    0%{transform:rotateY(180deg) scale(0.4);opacity:0;}
    60%{transform:rotateY(0deg) scale(1.08);opacity:1;}
    100%{transform:rotateY(0deg) scale(1);}
  }
  .v1-face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:64px;
    background:linear-gradient(135deg,#1a1a2e,#2a1a40);border:2px solid #d4af37;box-shadow:0 0 40px rgba(212,175,55,.6);backface-visibility:hidden;}
  .v1-shine{position:absolute;inset:0;border-radius:14px;overflow:hidden;}
  .v1-shine::after{content:'';position:absolute;top:-50%;left:-150%;width:60%;height:200%;
    background:linear-gradient(75deg,transparent,rgba(255,255,255,.5),transparent);
    animation:v1shine 1.4s ease-in-out 0.8s 2;}
  @keyframes v1shine{to{left:200%;}}
  .v1-text{margin-top:18px;font-size:30px;font-weight:900;color:#ffd700;text-shadow:0 0 20px #ffd700;
    opacity:0;animation:fadeUp 0.4s ease-out 0.7s forwards;}
  .v1-tag{margin-top:8px;font-size:9px;letter-spacing:3px;color:#d4af37;border:1px solid rgba(212,175,55,.5);
    padding:3px 12px;border-radius:2px;opacity:0;animation:fadeUp 0.4s ease-out 0.9s forwards;}

  /* ===== ВАРИАНТ 2: Слот-машина (вертикальный drop + удар + вспышка) ===== */
  .v2-shake{animation:v2shake 0.4s ease-out 0.55s;}
  @keyframes v2shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px) translateY(2px);}
    40%{transform:translateX(8px) translateY(-2px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
  }
  .v2-drop{font-size:80px;animation:v2drop 0.55s cubic-bezier(.55,0,.85,.35) forwards;filter:drop-shadow(0 0 24px #9b59b6);}
  @keyframes v2drop{
    0%{transform:translateY(-260px) scale(0.6);opacity:0;}
    80%{transform:translateY(0) scale(1.15);opacity:1;}
    100%{transform:translateY(0) scale(1);}
  }
  .v2-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:v2flash 0.3s ease-out 0.5s;}
  @keyframes v2flash{0%{opacity:0;}30%{opacity:.8;}100%{opacity:0;}}
  .v2-ring{position:absolute;width:40px;height:40px;border:3px solid #9b59b6;border-radius:50%;opacity:0;
    animation:v2ring 0.7s ease-out 0.55s forwards;}
  @keyframes v2ring{0%{transform:scale(0.3);opacity:1;}100%{transform:scale(7);opacity:0;}}
  .v2-text{margin-top:18px;font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 20px #9b59b6;
    opacity:0;animation:fadeUp 0.3s ease-out 0.75s forwards;}

  /* ===== ВАРИАНТ 3: Цифровая расшифровка (glitch decode) ===== */
  .v3-icon{font-size:72px;opacity:0;animation:v3in 0.4s ease-out 0.4s forwards, v3glitch 0.25s steps(2) 0.4s 4;
    filter:drop-shadow(0 0 18px #00e5ff);}
  @keyframes v3in{to{opacity:1;}}
  @keyframes v3glitch{
    0%{transform:translate(0,0);clip-path:inset(0 0 0 0);}
    25%{transform:translate(-4px,2px);clip-path:inset(20% 0 30% 0);filter:hue-rotate(90deg);}
    50%{transform:translate(4px,-2px);clip-path:inset(60% 0 5% 0);filter:hue-rotate(-90deg);}
    75%{transform:translate(-2px,0);clip-path:inset(10% 0 50% 0);}
    100%{transform:translate(0,0);clip-path:inset(0 0 0 0);}
  }
  .v3-scan{position:absolute;left:0;right:0;height:2px;background:rgba(0,229,255,.8);box-shadow:0 0 10px #00e5ff;
    animation:v3scan 0.9s linear 0.3s 1;}
  @keyframes v3scan{0%{top:-10%;opacity:1;}100%{top:110%;opacity:0;}}
  .v3-text{margin-top:18px;font-size:30px;font-weight:900;color:#00e5ff;text-shadow:0 0 20px #00e5ff;
    font-family:monospace;opacity:0;animation:v3textIn 0.3s steps(6) 0.7s forwards;overflow:hidden;white-space:nowrap;width:0;
    border-right:2px solid #00e5ff;animation:v3textIn 0.4s steps(8) 0.7s forwards;}
  @keyframes v3textIn{from{width:0;}to{width:8ch;border-right-color:transparent;}}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="controls">
  <button onclick="show(1)">Вариант 1: Голо-карта (flip + блик)</button>
  <button onclick="show(2)">Вариант 2: Слот-дроп (удар + вспышка)</button>
  <button onclick="show(3)">Вариант 3: Глитч-расшифровка</button>
</div>
<div id="stage"></div>

<script>
function show(n){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  const ov=document.createElement('div');
  ov.className='ov';
  if(n===1){
    ov.innerHTML=`
      <div class="v1-card"><div class="v1-inner">
        <div class="v1-face">🎴</div>
        <div class="v1-shine"></div>
      </div></div>
      <div class="v1-text">+250★</div>
      <div class="v1-tag">★ ЛЕГЕНДАРНЫЙ ★</div>`;
  } else if(n===2){
    ov.innerHTML=`
      <div class="v2-flash"></div>
      <div class="v2-ring" style="left:50%;top:42%;margin-left:-20px;margin-top:-20px;"></div>
      <div class="v2-shake"><div class="v2-drop">💎</div></div>
      <div class="v2-text">+250★</div>`;
  } else if(n===3){
    ov.innerHTML=`
      <div style="position:relative;">
        <div class="v3-icon">⚙️</div>
        <div class="v3-scan"></div>
      </div>
      <div class="v3-text">+250★</div>`;
  }
  stage.appendChild(ov);
}
show(1);
</script>
</body>
</html>
