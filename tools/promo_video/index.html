<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ZHIDAO Protocol — ролик 25 с</title>
<meta name="viewport" content="width=1080">
<style>
/* Ролик собирается в timeline.js: страница ничего не анимирует сама, каждый кадр -- seek(t). */
@font-face { font-family: "PT Sans"; font-weight: 400; src: url("/zhidao_v4/static/app/assets/fonts/pt-sans-400-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "PT Sans"; font-weight: 400; src: url("/zhidao_v4/static/app/assets/fonts/pt-sans-400-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "PT Sans"; font-weight: 700; src: url("/zhidao_v4/static/app/assets/fonts/pt-sans-700-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "PT Sans"; font-weight: 700; src: url("/zhidao_v4/static/app/assets/fonts/pt-sans-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #03103a; }
body { font-family: "PT Sans", "Microsoft YaHei", sans-serif; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
#world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 960px; }
#world > *, #ui > * { position: absolute; left: 0; top: 0; }
#ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
img { display: block; user-select: none; max-width: none; }
.fill { width: 1080px; height: 1920px; }

/* --- фоны -------------------------------------------------------------------------------- */
#bgNight { background: radial-gradient(ellipse 900px 900px at 540px 800px, #2a7cf0 0%, #0d3fa6 38%, #07216b 68%, #03103a 100%); }
#nightRays { background: repeating-conic-gradient(from 0deg at 540px 800px, rgba(130,200,255,.16) 0deg 5deg, transparent 5deg 15deg); -webkit-mask: radial-gradient(circle at 540px 800px, #000 0, transparent 1000px); mask: radial-gradient(circle at 540px 800px, #000 0, transparent 1000px); transform-origin: 540px 800px; }
#bgPhoto { overflow: hidden; clip-path: circle(0px at 540px 800px); }
#bgPhoto img { position: absolute; left: 0; top: 0; height: 1920px; width: auto; transform-origin: 0 0; }
#veil { background: linear-gradient(180deg, rgba(190,230,255,.55), rgba(120,190,250,.28) 45%, rgba(90,170,245,.5)); opacity: 0; }
#bgSky { background: radial-gradient(ellipse 1200px 900px at 14% 4%, #fff 0%, rgba(255,255,255,0) 60%), linear-gradient(180deg, #3fb0ff 0%, #86cffd 36%, #c4e9ff 70%, #eaf8ff 100%); opacity: 0; }
#skyRays { background: repeating-conic-gradient(from 200deg at 160px 90px, rgba(255,255,255,.3) 0deg 4deg, transparent 4deg 14deg); -webkit-mask: radial-gradient(circle at 160px 90px, #000 0, transparent 1700px); mask: radial-gradient(circle at 160px 90px, #000 0, transparent 1700px); transform-origin: 160px 90px; opacity: 0; }

/* --- аэро-декор: пузыри, сферы, блёстки, стеклянные квадраты, вспышки ------------------------ */
.bub { border-radius: 50%; border: 2px solid rgba(255,255,255,.65); opacity: 0;
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.95) 0 5%, rgba(255,255,255,.42) 11%, rgba(150,215,255,.16) 46%, rgba(255,255,255,.06) 72%, rgba(255,255,255,.5) 100%);
  box-shadow: inset 0 -8px 18px rgba(120,210,255,.35), inset 0 6px 12px rgba(255,255,255,.35), 0 4px 14px rgba(0,80,170,.14); }
.orb { border-radius: 50%; opacity: 0; }
.orb::after { content: ""; position: absolute; left: 16%; top: 8%; width: 46%; height: 30%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0)); }
.sq { border-radius: 16px; border: 3px solid rgba(255,255,255,.7); opacity: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.65), rgba(120,200,255,.28) 55%, rgba(60,150,230,.35)); box-shadow: inset 0 3px 0 rgba(255,255,255,.7), 0 14px 30px rgba(0,60,150,.28); }
.sq.g { background: linear-gradient(135deg, rgba(255,255,255,.6), rgba(120,230,160,.35) 55%, rgba(50,170,100,.4)); }
.spark { width: 70px; height: 70px; opacity: 0; background: radial-gradient(circle, #fff 0, rgba(255,255,255,0) 70%); }
.spark::before, .spark::after { content: ""; position: absolute; left: 50%; top: 50%; background: linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0)); width: 140px; height: 5px; transform: translate(-50%, -50%); border-radius: 4px; }
.spark::after { transform: translate(-50%, -50%) rotate(90deg); }
.flare { border-radius: 50%; opacity: 0; mix-blend-mode: screen; }
.streak { height: 10px; border-radius: 6px; opacity: 0; mix-blend-mode: screen; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(190,235,255,.95) 50%, rgba(255,255,255,0)); box-shadow: 0 0 40px 10px rgba(130,210,255,.7); }
svg.swoosh { overflow: visible; }

/* --- логотип ------------------------------------------------------------------------------- */
.logo img { width: 100%; height: 100%; }
.sheen { pointer-events: none; -webkit-mask: url("/zhidao_v4/static/app/assets/zhidao-dragon-logo.png") center / contain no-repeat; mask: url("/zhidao_v4/static/app/assets/zhidao-dragon-logo.png") center / contain no-repeat;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.55) 46%, rgba(255,255,255,.98) 50%, rgba(255,255,255,.55) 54%, transparent 60%); background-size: 300% 100%; background-repeat: no-repeat; }
.shock { border-radius: 50%; border: 8px solid rgba(190,235,255,.9); box-shadow: 0 0 40px rgba(110,200,255,.9), inset 0 0 40px rgba(110,200,255,.7); opacity: 0; }

/* --- загрузчик XP --------------------------------------------------------------------------- */
#boot { width: 640px; height: 70px; border-radius: 20px; border: 4px solid rgba(200,230,255,.95); background: linear-gradient(180deg, #05173d, #0a3382); overflow: hidden; opacity: 0;
  box-shadow: inset 0 4px 10px rgba(0,0,0,.6), 0 0 50px rgba(80,170,255,.6); }
#boot i { position: absolute; top: 9px; height: 44px; width: 54px; border-radius: 8px; background: linear-gradient(180deg, #e6faff 0%, #62c8ff 36%, #1c89ea 52%, #1360bd 100%); box-shadow: 0 0 18px rgba(120,215,255,.95); }

/* --- рабочий стол ------------------------------------------------------------------------- */
.dicon { width: 190px; text-align: center; opacity: 0; }
.dicon img { width: 124px; height: 124px; margin: 0 auto; filter: drop-shadow(0 8px 10px rgba(0,40,100,.5)); }
.dicon span { display: block; margin-top: 4px; font-size: 34px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 rgba(0,40,110,.8), 0 0 14px rgba(0,60,140,.9); }
#taskbar { left: 0; top: 1812px; width: 1080px; height: 108px; opacity: 0;
  background: linear-gradient(180deg, #3d95f5 0%, #2062d6 12%, #1a4fc0 55%, #1b53c4 100%); border-top: 4px solid #6bb0ff; box-shadow: 0 -10px 30px rgba(0,40,120,.35); }
#start { position: absolute; left: 0; top: -2px; width: 300px; height: 106px; border-radius: 0 56px 56px 0; display: flex; align-items: center; justify-content: center; gap: 14px;
  font-size: 58px; font-weight: 700; font-style: italic; color: #fff; text-shadow: 3px 3px 3px rgba(0,60,0,.55);
  background: linear-gradient(180deg, #78d566 0%, #3aa534 18%, #2f9a2d 60%, #3da638 100%); box-shadow: inset 0 4px 6px rgba(255,255,255,.55), inset 0 -8px 12px rgba(0,70,0,.4), 4px 0 12px rgba(0,30,90,.5); }
#start img { width: 62px; height: 62px; }
#tray { position: absolute; right: 0; top: 0; width: 360px; height: 100%; display: flex; align-items: center; justify-content: flex-end; gap: 22px; padding-right: 26px;
  background: linear-gradient(180deg, #19a0f0, #0f8de0 40%, #0c7ccb); border-left: 3px solid #0b5ba8; box-shadow: inset 6px 0 14px rgba(0,50,130,.35); }
#tray img { width: 54px; height: 54px; filter: drop-shadow(0 2px 2px rgba(0,30,90,.5)); }
#balloon { width: 600px; padding: 20px 26px 22px; border-radius: 26px; background: linear-gradient(180deg, #fffff0, #fff6c4); border: 4px solid #1a1a1a; opacity: 0; color: #111; box-shadow: 0 18px 36px rgba(0,30,90,.5); }
#balloon b { display: block; font-size: 40px; line-height: 1.1; }
#balloon span { display: block; margin-top: 6px; font-size: 34px; color: #333; }
#balloon::after { content: ""; position: absolute; right: 70px; bottom: -22px; width: 36px; height: 36px; background: #fff6c4; border-right: 4px solid #1a1a1a; border-bottom: 4px solid #1a1a1a; transform: rotate(45deg); }

/* --- рамки и карточки ---------------------------------------------------------------------- */
.xpcard { overflow: hidden; border-radius: 34px; border: 7px solid rgba(255,255,255,.92); background: #eaf4ff; opacity: 0;
  box-shadow: 0 40px 80px rgba(0,40,120,.5), 0 0 0 2px rgba(20,100,200,.4); -webkit-box-reflect: below 10px linear-gradient(transparent 78%, rgba(255,255,255,.3)); }
.xpcard img { position: absolute; left: 0; top: 0; }
.xpcard::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(125deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,.07) 28%, transparent 40%); }

/* --- телефон ------------------------------------------------------------------------------- */
.phone { opacity: 0; transform-origin: 0 0; will-change: transform; }
.pbezel { position: absolute; inset: 0; border-radius: 96px;
  background: linear-gradient(145deg, #f7fcff 0%, #a3d3f5 22%, #2c78c4 46%, #1b5aa6 58%, #9fd0f3 82%, #fff 100%);
  box-shadow: 0 70px 130px rgba(0,30,100,.6), inset 0 0 0 3px rgba(255,255,255,.8), inset 0 6px 14px rgba(255,255,255,.7); }
.pscreen { position: absolute; border-radius: 74px; overflow: hidden; background: #eef6fd; box-shadow: 0 0 0 5px #0a2f6b, 0 0 0 8px rgba(255,255,255,.55); }
.pscreen img { position: absolute; left: 0; top: 0; }
.pgloss { position: absolute; inset: 0; border-radius: 96px; pointer-events: none;
  background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.22) 32%, rgba(255,255,255,.04) 44%, transparent 56%); background-size: 260% 100%; background-repeat: no-repeat; }
.band { position: absolute; left: 0; width: 100%; overflow: hidden; }
.fxbeam { position: absolute; left: 0; width: 100%; height: 280px; opacity: 0; background: linear-gradient(180deg, rgba(120,235,255,0), rgba(120,235,255,.55) 70%, rgba(255,255,255,.98) 96%, rgba(255,255,255,0)); mix-blend-mode: screen; }
.fxring { position: absolute; border-radius: 50%; border: 8px solid rgba(255,255,255,.95); box-shadow: 0 0 40px rgba(110,220,255,.95), inset 0 0 36px rgba(110,220,255,.7); opacity: 0; }
.fxflash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #fff, rgba(255,255,255,.6) 40%, rgba(200,240,255,0) 75%); opacity: 0; }
.glint { position: absolute; border-radius: 22px; overflow: hidden; opacity: 0; }
.glint::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%); background-size: 300% 100%; background-position: var(--gp, 100%) 0; background-repeat: no-repeat; }
.impl { filter: drop-shadow(0 18px 24px rgba(0,50,130,.55)) drop-shadow(0 0 28px rgba(160,230,255,.9)); opacity: 0; }
.flipcard { opacity: 0; border-radius: 40px; overflow: hidden; border: 8px solid rgba(255,255,255,.95); background: #eef6fd; box-shadow: 0 40px 70px rgba(0,40,120,.5); -webkit-box-reflect: below 10px linear-gradient(transparent 70%, rgba(255,255,255,.28)); }
.flipcard img { position: absolute; left: 0; top: 0; }

/* --- курсор ------------------------------------------------------------------------------- */
#cursor { width: 60px; height: 80px; opacity: 0; filter: drop-shadow(4px 6px 5px rgba(0,30,90,.55)); transform-origin: 0 0; }
.ripple { border-radius: 50%; border: 7px solid rgba(255,255,255,.95); box-shadow: 0 0 24px rgba(120,220,255,.95), inset 0 0 20px rgba(120,220,255,.8); opacity: 0; }

/* --- кинетический текст -------------------------------------------------------------------- */
.cap { left: 40px; width: 1000px; text-align: center; font-weight: 700; font-size: 112px; line-height: 1.02; letter-spacing: -1px; }
.crow { display: block; white-space: nowrap; }
.kw { position: relative; isolation: isolate; display: inline-block; margin: 0 14px; opacity: 0; }
.kw b { position: relative; display: inline-block; font-weight: 700; color: transparent; padding: 0 4px;
  background: linear-gradient(180deg, #ffffff 0%, #c9f3ff 34%, #3fb8ff 54%, #0a67d6 100%); -webkit-background-clip: text; background-clip: text; }
.kw::before { content: attr(data-t); position: absolute; left: 4px; top: 0; z-index: -1; color: #fff; -webkit-text-stroke: 15px #fff; }
.kw::after { content: attr(data-t); position: absolute; left: 4px; top: 6px; z-index: -2; color: #0a4fb5; -webkit-text-stroke: 26px #0a4fb5; filter: drop-shadow(0 14px 14px rgba(0,40,120,.55)); }
.cap.dark .kw b { background: linear-gradient(180deg, #4fc6ff 0%, #1f86ea 48%, #0a4fb5 100%); -webkit-background-clip: text; background-clip: text; }
.cap.dark .kw::after { -webkit-text-stroke: 24px #fff; color: #fff; filter: drop-shadow(0 14px 14px rgba(0,60,150,.45)); }
.cap.dark .kw::before { -webkit-text-stroke: 12px #bfe6ff; color: #bfe6ff; }
.cap.small { font-size: 96px; }
.cap.xs { font-size: 80px; }
.cap.md { font-size: 104px; }

/* --- финал -------------------------------------------------------------------------------- */
#title6 { left: 0; width: 1080px; text-align: center; font-weight: 700; font-size: 132px; line-height: 1; letter-spacing: -2px; color: #fff; opacity: 0;
  text-shadow: 0 5px 0 #0a63bd, 0 10px 0 #084b97, 0 24px 34px rgba(0,60,150,.5); }
#sub6 { left: 0; width: 1080px; text-align: center; font-weight: 700; font-size: 76px; line-height: 1; color: #0a4fa8; opacity: 0; text-shadow: 0 3px 0 rgba(255,255,255,.9); }
#cta6 { left: 160px; width: 760px; height: 150px; border-radius: 76px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 82px; color: #fff; opacity: 0;
  background: linear-gradient(180deg, #9aeaff 0%, #2fb0f5 46%, #0f80d8 52%, #1799ea 100%); border: 6px solid #fff; text-shadow: 0 3px 0 rgba(0,60,140,.6);
  box-shadow: inset 0 7px 0 rgba(255,255,255,.6), inset 0 -16px 28px rgba(0,70,160,.35), 0 22px 44px rgba(0,70,170,.45); }
#flash { background: radial-gradient(circle at 50% 46%, #fff 0%, rgba(255,255,255,.88) 36%, rgba(220,244,255,.4) 70%, rgba(255,255,255,0) 100%); opacity: 0; }
#ringReveal { border-radius: 50%; border: 14px solid rgba(255,255,255,.95); box-shadow: 0 0 90px 24px rgba(150,220,255,.9), inset 0 0 90px rgba(150,220,255,.8); opacity: 0; }
#mosaic > div { border-radius: 14px; background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(110,200,255,.7) 50%, rgba(30,120,225,.85)); border: 3px solid rgba(255,255,255,.9); box-shadow: inset 0 3px 0 rgba(255,255,255,.8); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="fill" id="bgNight"></div>
    <div class="fill" id="nightRays"></div>
    <div class="fill" id="bgPhoto"><img id="photo" src="/zhidao_v4/static/app/assets/home/hainan-window.jpg" alt=""></div>
    <div class="fill" id="veil"></div>
    <div class="fill" id="bgSky"></div>
    <div class="fill" id="skyRays"></div>
  </div>
  <div id="ui"></div>
</div>
<script src="timeline.js"></script>
</body>
</html>
