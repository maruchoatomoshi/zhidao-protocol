name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace check below diffs HEAD~1 against HEAD, which needs
          # the parent commit. actions/checkout clones with depth 1 by default,
          # so without this the step dies on "unknown revision HEAD~1".
          fetch-depth: 2

      # The test server runs Python 3.12; test on the same minor version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax — API and bot
        run: |
          python -m py_compile zhidao_api_ready.py zhidao_bot_ready.py zhidao_web.py scripts/init_web_accounts.py
          python -m compileall -q zhidao_v4

      - name: Install standalone web dependencies
        run: python -m pip install -r requirements-web.txt

      - name: Install legacy Travel dependencies
        run: python -m pip install -r requirements-travel.txt

      # The whole suite, not a hand-picked subset: V4 domains, migrations,
      # auth, the bot, legacy startup, and the ?v= asset stamps
      # (tests/test_app_asset_versions.py runs stamp_assets.py --check).
      - name: Full test suite
        run: python -m pytest -q tests

      - name: JavaScript syntax — all frontend modules
        run: |
          status=0
          for f in js/*.js web/js/*.js zhidao_v4/static/architect/*.js zhidao_v4/static/app/*.js tools/*.cjs; do
            if ! node --check "$f"; then
              status=1
            fi
          done
          exit $status

      - name: Shell syntax — ops scripts
        run: |
          status=0
          for f in ops/*.sh; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              status=1
            fi
          done
          exit $status

      - name: Git whitespace check
        run: git diff --check HEAD~1 HEAD
