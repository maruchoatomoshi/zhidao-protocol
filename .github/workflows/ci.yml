name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Syntax checks (py_compile + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace check below diffs HEAD~1 against HEAD, which needs
          # the parent commit. actions/checkout clones with depth 1 by default,
          # so without this the step dies on "unknown revision HEAD~1".
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax — API and bot
        run: |
          python -m py_compile zhidao_api_ready.py zhidao_bot_ready.py zhidao_web.py scripts/init_web_accounts.py
          python -m compileall -q zhidao_v4

      - name: Install standalone web dependencies
        run: python -m pip install -r requirements-web.txt

      - name: Install legacy Travel dependencies
        run: python -m pip install -r requirements-travel.txt

      - name: Standalone learning web tests
        run: python -m unittest tests.test_web_learning_flow -v

      - name: Legacy Travel startup tests
        run: python -m unittest tests.test_travel_startup -v

      - name: V4 schema migration tests
        run: python -m unittest tests.test_v4_migrations -v

      - name: V4 authentication and role tests
        run: python -m unittest tests.test_v4_auth_api -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax — all frontend modules
        run: |
          status=0
          for f in js/*.js web/js/*.js zhidao_v4/static/architect/*.js; do
            if ! node --check "$f"; then
              status=1
            fi
          done
          exit $status

      - name: Git whitespace check
        run: git diff --check HEAD~1 HEAD
