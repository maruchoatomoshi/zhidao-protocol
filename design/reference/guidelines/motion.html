<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Движение</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:14px;background:#eef7fc;font:13px/1.4 var(--font-ui);color:var(--text-primary)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sw{display:flex;flex-direction:column;gap:4px;width:104px}.sw i{display:block;height:44px;border:1px solid var(--border-aqua);border-radius:4px}.sw b{font:700 10px/1.2 var(--font-ui)}.sw span{font:9px/1.2 var(--font-system);color:var(--ink-muted-aqua)}</style></head><body><div class="row"><span class="sw" style="width:120px"><i style="height:26px;background:linear-gradient(90deg,#3a95ea 0 33%,#e0edf6 33%)"></i><b>press 90ms</b><span>--dur-press</span></span><span class="sw" style="width:120px"><i style="height:26px;background:linear-gradient(90deg,#3a95ea 0 55%,#e0edf6 55%)"></i><b>hover 160ms</b><span>--dur-hover</span></span><span class="sw" style="width:120px"><i style="height:26px;background:linear-gradient(90deg,#3a95ea 0 100%)"></i><b>panel 320ms</b><span>--dur-panel</span></span><span class="zd-sub" style="max-width:190px">Сдвиг на 1 px вместо смены цвета; системное «уменьшить движение» гасит всё.</span></div></body></html>
