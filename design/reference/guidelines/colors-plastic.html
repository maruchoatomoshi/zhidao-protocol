<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Пластик и хром</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:14px;background:#eef7fc;font:13px/1.4 var(--font-ui);color:var(--text-primary)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sw{display:flex;flex-direction:column;gap:4px;width:104px}.sw i{display:block;height:44px;border:1px solid var(--border-aqua);border-radius:4px}.sw b{font:700 10px/1.2 var(--font-ui)}.sw span{font:9px/1.2 var(--font-system);color:var(--ink-muted-aqua)}</style></head><body><div class="row"><span class="sw"><i style="background:linear-gradient(180deg,#bcdcff,#3a95ea 52%,#0a4f92)"></i><b>Небо</b><span>--plastic-sky-*</span></span><span class="sw"><i style="background:linear-gradient(180deg,#a9edf4,#2ec2ea 52%,#0a6ea8)"></i><b>Аква</b><span>--plastic-aqua-*</span></span><span class="sw"><i style="background:linear-gradient(180deg,#e2f9b4,#9ce94e 52%,#4d8f1c)"></i><b>Лайм</b><span>--plastic-lime-*</span></span><span class="sw"><i style="background:linear-gradient(180deg,#f2f7fa,#c3d3dd 46%,#8ea6b5 47%,#c3d3dd)"></i><b>Хром</b><span>--metal-*</span></span><span class="sw"><i style="background:#a8302a"></i><b>Опасное</b><span>--alert</span></span></div></body></html>
