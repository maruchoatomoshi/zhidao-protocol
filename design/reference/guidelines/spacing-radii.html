<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Радиусы</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:14px;background:#eef7fc;font:13px/1.4 var(--font-ui);color:var(--text-primary)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sw{display:flex;flex-direction:column;gap:4px;width:104px}.sw i{display:block;height:44px;border:1px solid var(--border-aqua);border-radius:4px}.sw b{font:700 10px/1.2 var(--font-ui)}.sw span{font:9px/1.2 var(--font-system);color:var(--ink-muted-aqua)}</style></head><body><div class="row"><span class="sw" style="width:88px"><i style="height:52px;border-radius:var(--radius-xs);background:linear-gradient(180deg,#fff,#cfeafa)"></i><b>radius-xs</b></span><span class="sw" style="width:88px"><i style="height:52px;border-radius:var(--radius-sm);background:linear-gradient(180deg,#fff,#cfeafa)"></i><b>radius-sm</b></span><span class="sw" style="width:88px"><i style="height:52px;border-radius:var(--radius-md);background:linear-gradient(180deg,#fff,#cfeafa)"></i><b>radius-md</b></span><span class="sw" style="width:88px"><i style="height:52px;border-radius:var(--radius-lg);background:linear-gradient(180deg,#fff,#cfeafa)"></i><b>radius-lg</b></span><span class="sw" style="width:88px"><i style="height:52px;border-radius:var(--radius-xl);background:linear-gradient(180deg,#fff,#cfeafa)"></i><b>radius-xl</b></span><span class="sw" style="width:88px"><i style="height:52px;border-radius:5px;background:#fff;border-color:#8fbcd6"></i><b>окно Луны</b><span>5px</span></span></div></body></html>
