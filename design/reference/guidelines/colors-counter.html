<!-- @dsCard group="Colors" viewport="700x170" name="Счётчик в шапке" subtitle="Ячейки с поперечной линией, цифры #8dff72, разделители #5b7a90" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Счётчик</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:14px;background:#eef7fc;font:13px/1.4 var(--font-ui);color:var(--text-primary)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.sw{display:flex;flex-direction:column;gap:4px;width:104px}.sw i{display:block;height:44px;border:1px solid var(--border-aqua);border-radius:4px}.sw b{font:700 10px/1.2 var(--font-ui)}.sw span{font:9px/1.2 var(--font-system);color:var(--ink-muted-aqua)}</style></head><body><div class="row"><span class="hit-counter hit-counter-star"><b>0</b><b>2</b><b>1</b><b>2</b></span><span class="hit-counter hit-counter-sm hit-counter-star"><b>0</b><b>2</b><b>1</b><b>2</b></span><span class="sw"><i style="background:linear-gradient(#262626 0 49%,#0d0d0d 51%)"></i><b>Ячейка</b><span>--counter-cell</span></span><span class="sw"><i style="background:#8dff72"></i><b>Цифры</b><span>--counter-ink</span></span><span class="sw"><i style="background:#5b7a90"></i><b>Разделитель</b><span>--counter-sep</span></span><span class="sw"><i style="background:#f5b400"></i><b>Звезда</b><span>--counter-star</span></span></div></body></html>
