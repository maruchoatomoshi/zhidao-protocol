<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZHIDAO — окна игр, часть 2</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:#dceef6}
body{padding:20px;font:13px/1.5 var(--font-ui);color:var(--text-primary)}
h2{margin:26px 0 4px;font:700 20px/1.2 var(--font-ui)}
h2:first-of-type{margin-top:4px}
.intro{max-width:74ch;color:var(--ink-muted-aqua)}
.row{display:flex;flex-wrap:wrap;gap:18px;margin:12px 0 0}
.slot{display:flex;flex-direction:column;gap:8px;width:390px;margin:0}
.slot>figcaption{font:700 11px/1.3 var(--font-system);letter-spacing:.1em;color:#2b7b9e;text-transform:uppercase}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body>
<div id="root"></div>
<script type="text/babel" src="TableGames.jsx"></script>
<script type="text/babel">
const { PhoneFrame, AppHeader, BottomNav } = window.ZHIDAOProtocolDesignSystem_ad77c0;
const nav = window.ZHIDAOProtocolDesignSystem_ad77c0.NAV_ITEMS.map((i) => ({ ...i, icon: "../../" + i.icon }));

function Board({ caption, skin, theme, children }) {
  return (
    <figure className="slot">
      <figcaption>{caption}</figcaption>
      <PhoneFrame skin={skin} theme={theme} label={caption}
        header={<AppHeader stars={212} logo="../../assets/zhidao-dragon-logo-256.png" />}
        nav={<BottomNav value="events" items={nav} />}>
        {children}
      </PhoneFrame>
    </figure>
  );
}

const Trio = ({ name, Lobby, Round, Result, night }) => (
  <React.Fragment>
    <div className="row">
      <Board caption={name + " · Аква · лобби"} skin="aqua"><Lobby /></Board>
      <Board caption={name + " · Луна-Аква · лобби"} skin="luna"><Lobby /></Board>
      <Board caption={name + " · Аква · раунд"} skin="aqua"><Round /></Board>
      <Board caption={name + " · Луна-Аква · раунд"} skin="luna"><Round /></Board>
      {night && <Board caption={name + " · Аква · раунд, ночь"} skin="aqua" theme="dark"><Round /></Board>}
      <Board caption={name + " · Аква · итог"} skin="aqua"><Result /></Board>
      <Board caption={name + " · Луна-Аква · итог"} skin="luna"><Result /></Board>
    </div>
  </React.Fragment>
);

function Page() {
  return (
    <React.Fragment>
      <h2>Контрабанда 走私</h2>
      <p className="intro">Карты товаров, событие смены, прилавок — из smuggle.css. Данные: код комнаты и состав — сервер; карты, событие и итог досмотра — пример. Убрано как дубль: правила ушли в «Как играть?», счёт — в REP. Открытый вопрос: «Рынок контрабанды» — это отдельное окно или вкладка внутри этого?</p>
      <Trio name="Контрабанда" Lobby={SmuggleLobby} Round={SmuggleRound} Result={SmuggleResult} night />

      <h2>Тайный агент 特工</h2>
      <p className="intro">Карточка цели и задание дня — из agent.css. Имя цели сервер показывает только владельцу экрана, в макете его нет. Открытый вопрос: показывать ли счёт «раскрыто» участнику или только вожатому.</p>
      <Trio name="Тайный агент" Lobby={AgentLobby} Round={AgentRound} Result={AgentResult} />

      <h2>Зомби-протокол 僵尸</h2>
      <p className="intro">Личный код человека, станция-вакцина, счёт сторон — из zombie.css. Первой строкой идёт правило безопасности: игра без бега и касаний. Открытый вопрос: код человека — четыре цифры или слово-иероглиф?</p>
      <Trio name="Зомби" Lobby={ZombieLobby} Round={ZombieRound} Result={ZombieResult} night />

      <h2>Саботаж 破坏</h2>
      <p className="intro">Роль, задания у станций по GPS, собрание — из sabotage.css. Полоса заданий экипажа — прибор, не цифра. Открытый вопрос: сдача станции по GPS автоматически или кнопкой «Сдать станцию»?</p>
      <Trio name="Саботаж" Lobby={SabotageLobby} Round={SabotageRound} Result={SabotageResult} night />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script></body></html>
